name: Push to Main

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel a run partway; queue the next one.
concurrency:
  group: push-main
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ungood/standards/.github/workflows/ci.yml@26f872057cc96483a7e6b4e293dfe8acaa3778c8 # v1.0.0
